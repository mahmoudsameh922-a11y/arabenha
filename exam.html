<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الامتحانات</title>
</head>
<body>
<h1>امتحان صغير</h1>
<p>1- اسم الفاعل من كتب؟</p>
<input type="radio" name="q1" value="0"> مكتوب<br>
<input type="radio" name="q1" value="1"> كاتب<br>
<input type="radio" name="q1" value="0"> كتاب<br>

<p>2- جمع كلمة مدرسة؟</p>
<input type="radio" name="q2" value="1"> مدارس<br>
<input type="radio" name="q2" value="0"> مدرس<br>
<input type="radio" name="q2" value="0"> مدرسون<br>

<br>
<button onclick="result()">إظهار النتيجة</button>
<h2 id="score"></h2>

<script>
function result(){
let score = 0;
let answers = document.querySelectorAll("input[type='radio']:checked");
answers.forEach(a=> score += parseInt(a.value));
document.getElementById("score").innerHTML = "درجتك: " + score + " من 2";
}
</script>

<a href="index.html">العودة للصفحة الرئيسية</a>
</body>
</html>
